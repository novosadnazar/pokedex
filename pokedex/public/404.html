<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pokedex</title>
    <script type="text/javascript">
    
      var pathSegmentsToKeep = 1; 
      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      
     
      if (l.search) {
        redirectUrl += '&q=' + l.search.slice(1).replace(/&/g, '~and~');
      }
      if (l.hash) {
        redirectUrl += '&h=' + l.hash.slice(1);
      }
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
