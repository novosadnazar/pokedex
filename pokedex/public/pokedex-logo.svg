

        
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" class="w-full h-auto select-none" id="pokedexLogoSvg">
          <defs>
            <!-- Вбудований шрифт Pokemon Solid -->
            <style>
              @font-face {
                font-family: 'Pokemon Solid';
                src: none format('woff');
                font-weight: 900;
                font-style: normal;
              }

              .logo-text {
                font-family: 'Pokemon Solid', 'Arial Black', sans-serif;
                font-weight: 900;
                text-anchor: middle;
                dominant-baseline: central;
              }
            </style>

            <!-- Yellow Gradient for Main Text Fill -->
            <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFDE00"></stop>
              <stop offset="60%" stop-color="#FFDE00"></stop>
              <stop offset="100%" stop-color="#E6A100"></stop>
            </linearGradient>

            <!-- Inner Light Highlight Gradient -->
            <linearGradient id="innerHighlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFF59D"></stop>
              <stop offset="100%" stop-color="#FFC107"></stop>
            </linearGradient>

            <!-- Blue 3D Shadow Gradient -->
            <linearGradient id="blue3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1B4EA1"></stop>
              <stop offset="100%" stop-color="#0F2C61"></stop>
            </linearGradient>

            <!-- Outer Dark Blue Stroke -->
            <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#0A1833" flood-opacity="0.5"></feDropShadow>
            </filter>
          </defs>

          <g filter="url(#shadowFilter)">
            
            <!-- 1. Deepest 3D Blue Extrusion Layers (Extruded Downwards & Right) -->
            <g fill="none" stroke="#1B53BA" stroke-width="36" stroke-linejoin="round" stroke-linecap="round">
              <text x="525" y="195" class="logo-text" font-size="180">Pokédex</text>
              <text x="524" y="193" class="logo-text" font-size="180">Pokédex</text>
              <text x="523" y="191" class="logo-text" font-size="180">Pokédex</text>
              <text x="522" y="189" class="logo-text" font-size="180">Pokédex</text>
              <text x="521" y="187" class="logo-text" font-size="180">Pokédex</text>
            </g>

            <g fill="none" stroke="#123B8A" stroke-width="32" stroke-linejoin="round" stroke-linecap="round">
              <text x="520" y="185" class="logo-text" font-size="180">Pokédex</text>
              <text x="519" y="183" class="logo-text" font-size="180">Pokédex</text>
              <text x="518" y="181" class="logo-text" font-size="180">Pokédex</text>
            </g>

            <!-- 2. Outer Deep Blue Border Layer -->
            <text x="515" y="175" class="logo-text" font-size="180" fill="#1B53BA" stroke="#1B53BA" stroke-width="32" stroke-linejoin="round" stroke-linecap="round">Pokédex</text>

            <!-- 3. Inner Darker Blue Outline -->
            <text x="515" y="175" class="logo-text" font-size="180" fill="#2A68D7" stroke="#2A68D7" stroke-width="18" stroke-linejoin="round">Pokédex</text>

            <!-- 4. Inner Dark Yellow / Orange Shadow Stroke -->
            <text x="515" y="175" class="logo-text" font-size="180" fill="none" stroke="#C78200" stroke-width="10" stroke-linejoin="round">Pokédex</text>

            <!-- 5. Main Yellow Fill with Gradient -->
            <text x="515" y="175" class="logo-text" font-size="180" fill="url(#yellowGrad)">Pokédex</text>

            <!-- 6. Accent Top Light Highlight Effect -->
            <text x="515" y="173" class="logo-text" font-size="180" fill="none" stroke="#FFF799" stroke-width="3" stroke-linejoin="round" opacity="0.8">Pokédex</text>

          </g>
        </svg>