<svg id="pokeballSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-full h-full">
          <!-- External Outer Black Stroke / Shell -->
          <circle cx="50" cy="50" r="44" fill="none" stroke="#111827" stroke-width="8"></circle>

          <!-- Top Red Half -->
          <path d="M 6,50 A 44,44 0 0,1 94,50 Z" fill="#EF4444"></path>

          <!-- Bottom White Half -->
          <path d="M 6,50 A 44,44 0 0,0 94,50 Z" fill="#FFFFFF"></path>

          <!-- Top Red Shadow Overlay (Volume) -->
          <path d="M 12,32 A 44,44 0 0,1 88,32 A 44,44 0 0,0 12,32 Z" fill="#DC2626" opacity="0.3"></path>

          <!-- Bottom White Shadow Overlay -->
          <path d="M 88,50 A 44,44 0 0,1 64,90 A 44,44 0 0,0 88,50 Z" fill="#E2E8F0"></path>

          <!-- Center Horizontal Line Splitter -->
          <line x1="6" y1="50" x2="94" y2="50" stroke="#111827" stroke-width="8" stroke-linecap="round"></line>

          <!-- Center Button Outer Ring -->
          <circle cx="50" cy="50" r="14" fill="#111827"></circle>

          <!-- Center Button White Inner Circle -->
          <circle cx="50" cy="50" r="8" fill="#FFFFFF"></circle>

          <!-- Inner Button Highlight -->
          <circle cx="48" cy="48" r="3" fill="#F8FAFC"></circle>
        </svg>